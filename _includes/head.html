<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="{{ site.name }}">
  <meta name="theme-color" content="#0B0F14">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.name }} · {{ site.tagline | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/{{ site.pic }}">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/cv.css">
</head>
