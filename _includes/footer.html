<footer id="contact" class="site-footer">
  <div class="container">
    <p class="prompt">$ echo $CONTACT</p>
    <a class="footer-mail" href="mailto:{{ site.email }}">{{ site.email }}</a>
    <div class="footer-bottom">
      <span>© {{ site.time | date: '%Y' }} {{ site.name | downcase }}</span>
      <nav aria-label="Profiles">
        <a href="https://github.com/{{ site.github }}">github</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin }}">linkedin</a>
        <a href="https://www.researchgate.net/profile/{{ site.researchgate }}">researchgate</a>
      </nav>
    </div>
  </div>
</footer>
