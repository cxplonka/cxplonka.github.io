<section id="stack" class="section">
  <h2 class="section-title"><span class="accent">//</span> stack</h2>
  <div class="grid">
    {% for g in site.data.stack.groups %}
    <div class="card stack-card">
      <h3>{{ g.name }}</h3>
      <ul class="tags">{% for i in g.items %}<li>{{ i }}</li>{% endfor %}</ul>
    </div>
    {% endfor %}
  </div>
  {% if site.data.stack.practices %}<p class="stack-practices"><span class="key">practices:</span> {{ site.data.stack.practices }}</p>{% endif %}
</section>
